name: Build and release desktop binaries

# Triggered when you push a version tag like v0.1.0.
# Produces sa-rebuild-mac.zip and sa-rebuild-windows.zip attached to the
# GitHub Release page — your end users download from there. Manual
# `workflow_dispatch` is also enabled so you can do dry-run builds without
# tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: sa-rebuild-mac.zip
            bundle_path: dist/sa-rebuild.app
            bundle_kind: app
          - os: windows-latest
            artifact: sa-rebuild-windows.zip
            bundle_path: dist/sa-rebuild
            bundle_kind: dir

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e .
          pip install streamlit pyinstaller

      - name: Run unit tests
        run: pytest -q

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyi_work sa-rebuild.spec

      - name: Package macOS .app
        if: matrix.bundle_kind == 'app'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }} sa-rebuild.app

      - name: Package Windows folder
        if: matrix.bundle_kind == 'dir'
        run: |
          Compress-Archive -Path dist\sa-rebuild -DestinationPath ${{ matrix.artifact }}
        shell: pwsh

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Attach binaries to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
