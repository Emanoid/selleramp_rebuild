  "Baby Products": 1900000
  "Industrial & Scientific": 14000000
  "Tools & Home Improvement": 17000000
  "Automotive": 27000000
  "Clothing, Shoes & Jewelry": 175000000
  "Books": 65000000
  "Video Games": 600000
  "Movies & TV": 1200000
  "Cell Phones & Accessories": 9500000
  "Arts, Crafts & Sewing": 8000000
  "Musical Instruments": 1300000
  # Common leaves (seed — extend as you source from new categories)
  "Mules & Clogs": 1500000
