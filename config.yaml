# SellerAmp-parity config — mirrors the user's "FBA" profile.
# Edit values here to retune without touching code.

marketplace:
  domain: US                # Keepa domain string ("US", "GB", "CA"...)
  amazon_seller_id: ATVPDKIKX0DER

# Keepa fetch parameters
keepa:
  stats_days: 180
  offers: 20
  history: true
  rating: true
  cache_ttl_hours: 24
  expected_token_cost: 8     # conservative; client adjusts using actual response

# Throttling — when predicted wait exceeds this, checkpoint and exit gracefully.
runtime:
  max_wait_minutes: 30

# Fee profile (mirrors SellerAmp screenshot)
fees:
  inbound_per_lb_usd: 0.80
  misc_pct: 0.0663            # 6.63%
  prep_flat_usd: 0.0
  misc_flat_usd: 0.0
  # Referral % resolution: config override wins over Keepa's value (lets you
  # calibrate against SellerAmp). Default applies when neither is set.
  referral_default_pct: 0.15
  referral_overrides_by_root_category:
    Grocery: 0.08
    "Grocery & Gourmet Food": 0.08
    Electronics: 0.08
    "Cell Phones & Accessories": 0.08
    "Clothing, Shoes & Jewelry": 0.17    # Amazon's apparel rate >$15
    Health: 0.15
    Beauty: 0.15

# Pricing recommendation thresholds (volatility = stddev/mean of buy-box price, 90d)
pricing:
  cv_stable: 0.05
  cv_moderate: 0.15

# Competition / dominance
competition:
  amazon_dominance_pct: 0.70
  brand_dominance_pct: 0.60
  brand_name_fuzz_threshold: 85   # rapidfuzz partial_ratio
  amazon_dominance_window_days: 90
  top_buybox_window_days: 30

# Viability thresholds (filters)
viability:
  min_profit_usd: 1.00
  min_roi_pct: 0.30
  max_bsr_pct: 0.02              # 2%
  max_fba_seller_count: 15        # caution-flag above this

# Variation analysis (opt-in: each sibling fetched costs ~7 tokens).
# CLI flag --variations N overrides fetch_max.
variations:
  fetch_max: 0                     # 0 = disabled; e.g. 20 = fetch up to 20 siblings per parent
  max_seller_count: 10             # sibling counts as viable if total live sellers < this
  buy_box_min_ratio: 1.0           # sibling buy box must be >= ratio × main recommended_sell_price

# Approximate US Amazon category sizes used to compute BSR percentile.
# bsr_pct uses the LEAF category from Keepa's categoryTree first (matches
# SellerAmp behavior), falling back to root if the leaf isn't listed here.
# Update from Keepa's category browser when these drift. Add leaves you source
# from often (a few common ones are seeded below — most leaves not seeded
# yield bsr_pct=None, which means the row is reported but skipped from the
# slow-seller filter rather than mis-classified).
category_sizes:
  # Roots
  "Toys & Games": 7900000
  "Home & Kitchen": 28000000
  "Electronics": 13000000
  "Beauty & Personal Care": 8500000
  "Health & Household": 5800000
